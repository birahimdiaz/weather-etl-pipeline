input {
  file {
    path => [
      "/weather/raw/paris_*.json",
      "/weather/raw/dakar_*.json"
    ]
    mode => "read"
    ecs_compatibility => "disabled"

    sincedb_path => "/usr/share/logstash/data/weather.sincedb"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"

    codec => multiline {
      pattern => "^\{"
      negate => true
      what => "previous"
      auto_flush_interval => 2
    }
  }
}

filter {
  json {
    source => "message"
    target => "raw"
  }

  if "_jsonparsefailure" not in [tags] {
    if [path] =~ /\/dakar_/ {
      mutate {
        add_field => { "city" => "Dakar" }
      }
    } else {
      mutate {
        add_field => { "city" => "Paris" }
      }
    }

    mutate {
      copy => {
        "[raw][current][temperature_2m]" => "temperature_c"
        "[raw][current][relative_humidity_2m]" => "humidity_pct"
        "[raw][current][precipitation]" => "precipitation_mm"
      }
    }

    date {
      match => ["[raw][current][time]", "ISO8601"]
      timezone => "UTC"
      target => "weather_time"
    }

    if "_dateparsefailure" not in [tags] {
      ruby {
        code => '
          city = event.get("city").downcase
          time = event.get("weather_time").time.utc.strftime("%Y%m%dT%H%M%SZ")
          event.set("[@metadata][document_id]", "#{city}_#{time}")
        '
      }

      mutate {
        remove_field => [
          "raw", "message", "path", "host", "@version", "tags"
        ]
      }
    }
  }
}

output {
  if [@metadata][document_id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "weather"
      document_id => "%{[@metadata][document_id]}"
      action => "index"
      data_stream => false
      manage_template => false
      ilm_enabled => false
    }
  }

  stdout {
    codec => rubydebug
  }
}
